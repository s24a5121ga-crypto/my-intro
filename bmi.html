<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator | Yanashon Tools</title>
    <link rel="stylesheet" href="bmi.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container fade-in">
        <header>
            <h1 class="title fade-in">BMI Calculator</h1>
            <p class="subtitle fade-in">あなたの身長と体重からBMIを瞬時に計算・判定します</p>
        </header>

        <main>
            <div class="calculator-card fade-in">
                <div class="input-group">
                    <label for="height">身長 (cm)</label>
                    <input type="number" id="height" placeholder="例: 170" step="0.1" required>
                </div>
                <div class="input-group">
                    <label for="weight">体重 (kg)</label>
                    <input type="number" id="weight" placeholder="例: 60" step="0.1" required>
                </div>
                <button id="calculate-btn" class="btn">計算する</button>
            </div>

            <div id="result-container" class="result-card hidden">
                <h2 id="bmi-value" class="fade-in">--</h2>
                <div id="bmi-category" class="category-badge fade-in">--</div>
                <div id="bmi-description" class="description fade-in"></div>
            </div>
            
            <a href="index.html" class="back-link fade-in">← ポートフォリオに戻る</a>
        </main>
    </div>
    <script src="bmi.js"></script>
</body>
</html>
